[package]
name = "omadeck-core"
description = "Config, rendering, actions and device glue shared by omadeck and omadeckd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
elgato-streamdeck = "0.13"
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
resvg = "0.48"
ab_glyph = "0.2"
shell-words = "1"
libc = "0.2"

[features]
# `Renderer::with_font_bytes` and the bundled test font, for other crates' tests:
# `omadeck-core = { workspace = true, features = ["test-support"] }` under
# `[dev-dependencies]`.
test-support = []
