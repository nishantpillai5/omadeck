name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch, like Omarchy: current GTK4/libadwaita that the app targets.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        # ttf-dejavu: the render tests draw text and need at least one installed font.
        run: pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita systemd-libs fontconfig ttf-dejavu git
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Check shell scripts
        run: bash -n scripts/*.sh
