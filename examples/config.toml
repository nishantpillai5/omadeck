# omadeck example configuration
# Copy to ~/.config/omadeck/config.toml, or just use the `omadeck` app.
#
# Keys are numbered left-to-right, top-to-bottom starting at 0. Top-level [[key]]s are the
# Home page; more pages are [[page]] tables with their own [[page.key]]s.
# Icon paths may be absolute, start with ~/, or be relative to ~/.config/omadeck/.

brightness = 70                # start value; the deck remembers its last brightness, and an edit here sets it

[style]
follow_theme = true          # use the active Omarchy theme's colours
# background = "#1a1b26"     # override the default key background
# label_color = "#c0caf5"
# font = "JetBrainsMono Nerd Font"

[[key]]
index = 0
label = "btop"
icon = "/usr/share/icons/hicolor/scalable/apps/btop.svg"
[key.action]
type = "app"
command = "xdg-terminal-exec btop"   # a desktop entry id (foo.desktop) or any command line

[[key]]
index = 1
label = "Omarchy"
icon = "/usr/share/pixmaps/omarchy.png"
[key.action]
type = "url"
url = "https://omarchy.org"

[[key]]
index = 2
label = "Workspace 1"
[key.action]
type = "hyprland"
dispatch = "workspace 1"

[[key]]
index = 3
label = "Ding"
background = "#e8905a"
[key.action]
type = "sound"
file = "/usr/share/sounds/freedesktop/stereo/complete.oga"
volume = 0.8

[[key]]
index = 4
label = "Backup"
[key.action]
type = "script"
path = "~/bin/backup.sh"
terminal = true              # open in a terminal so you can watch it run

[[key]]
index = 5
label = "Media"
glyph = "f024b"              # folder symbol
[key.action]
type = "page"
page = "Media"               # the name of a [[page]] below

[[page]]
name = "Media"
# folder = true                # skipped by flicks and page_step

[[page.key]]
index = 0
label = "Back"
glyph = "f004d"
[page.key.action]
type = "back"                # the previous page, or Home

[[page.key]]
index = 1
label = "Play"
glyph = "f040a"              # play
[page.key.action]
type = "media"               # play/pause, through Omarchy's media keys when it has them
[page.key.on]
label = "Pause"              # an on face follows the player: shown while it plays
glyph = "f03e4"              # pause: what a press will do

[[page.key]]
index = 2
label = "Next"
glyph = "f04ad"
[page.key.action]
type = "media"
command = "next"             # or "previous", "stop"
# player = "spotify"         # optional: only this player (default: the one playing)

# [[key]]
# index = 6
# label = "Next page"
# glyph = "f0054"              # right arrow
# [key.action]
# type = "page_step"
# change = 1                   # next page; -1 is previous, folders are skipped

# A toggle key: a second face ([key.on]) that follows real state. The state
# command exits 0 when on, 75 while busy (its first output line is the progress,
# "NN%" for the bar), anything else off. No state: a volume mute key follows its
# mute, any other key flips on each press.
[[key]]
index = 10
label = "Mic"
glyph = "f036c"
[key.action]
type = "volume"
device = "input"
mute = true                    # the key toggles the mute…
[key.on]
label = "Muted"                # …and the on face follows it (no state)
glyph = "f036d"

# A toggle with a state command: the face follows the command's exit status.
# [[key]]
# index = 11
# label = "Night light"
# [key.action]
# type = "app"
# command = "omarchy-toggle-nightlight"
# [key.on]
# label = "Night on"
# state = "omarchy-toggle-nightlight --status | jq -e .enabled"
# interval = 2                 # seconds between runs (at least 1; the configurator offers 1–60)
# action = { type = "app", command = "…" }   # optional: run this instead while on (Elgato's Hotkey Switch)
#
# A slow toggle: a press shows busy at once and polls fast until the state moves.
# [[key]]
# index = 12
# label = "Backup"
# busy_while_running = true    # busy for as long as the key's own command runs
# [key.action]
# type = "script"
# path = "scripts/backup.sh"
# [key.on]
# slow = true
# state = "systemctl --user is-active -q backup.service"
# [key.busy]
# bar = true   # draw a progress bar from the first "NN%" in the output
#
# A slow toggle for a systemd user service (a model server), with a health check.
# [[key]]
# index = 13
# label = "LLM off"
# glyph = "f048b"
# [key.action]
# type = "app"
# command = "systemctl --user is-active -q llm.service && systemctl --user stop --no-block llm.service || systemctl --user start --no-block llm.service"
# [key.on]
# label = "LLM on"
# slow = true
# state = """\ns=$(systemctl --user is-active llm.service)\ncase $s in\n  active) curl -sf -o /dev/null -m 2 http://127.0.0.1:8000/health && exit 0\n          echo Loading; exit 75 ;;\n  activating|deactivating|reloading) echo "$s"; exit 75 ;;\n  *) exit 1 ;;\nesac"""
