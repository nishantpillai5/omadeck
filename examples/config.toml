# omadeck example configuration
# Copy to ~/.config/omadeck/config.toml, or just use the `omadeck` app.
#
# Keys are numbered left-to-right, top-to-bottom starting at 0. Top-level [[key]]s are the
# Home page; more pages are [[page]] tables with their own [[page.key]]s.
# Icon paths may be absolute, start with ~/, or be relative to ~/.config/omadeck/.

brightness = 70                # start value; the deck remembers its last brightness, and an edit here sets it

[style]
follow_theme = true          # use the active Omarchy theme's colours
# background = "#1a1b26"     # override the default key background
# label_color = "#c0caf5"
# font = "JetBrainsMono Nerd Font"

[[key]]
index = 0
label = "btop"
icon = "/usr/share/icons/hicolor/scalable/apps/btop.svg"
[key.action]
type = "app"
command = "xdg-terminal-exec btop"   # a desktop entry id (foo.desktop) or any command line

[[key]]
index = 1
label = "Omarchy"
icon = "/usr/share/pixmaps/omarchy.png"
[key.action]
type = "url"
url = "https://omarchy.org"

[[key]]
index = 2
label = "Workspace 1"
[key.action]
type = "hyprland"
dispatch = "workspace 1"

[[key]]
index = 3
label = "Ding"
background = "#e8905a"
[key.action]
type = "sound"
file = "/usr/share/sounds/freedesktop/stereo/complete.oga"
volume = 0.8

[[key]]
index = 4
label = "Backup"
[key.action]
type = "script"
path = "~/bin/backup.sh"
terminal = true              # open in a terminal so you can watch it run

[[key]]
index = 5
label = "Media"
glyph = "f024b"              # folder symbol
[key.action]
type = "page"
page = "Media"               # the name of a [[page]] below

[[page]]
name = "Media"
# folder = true                # skipped by flicks and page_step

[[page.key]]
index = 0
label = "Back"
glyph = "f004d"
[page.key.action]
type = "back"                # the previous page, or Home

[[page.key]]
index = 1
label = "Play/Pause"
[page.key.action]
type = "app"
command = "playerctl play-pause"

# [[key]]
# index = 6
# label = "Next page"
# glyph = "f0054"              # right arrow
# [key.action]
# type = "page_step"
# change = 1                   # next page; -1 is previous, folders are skipped

# The touch strip's background image (Stream Deck +): one image across all the
# panels, under the dial panels. Any size - it fills the strip and is
# centre-cropped. Relative paths are against this file's folder.
# [strip]
# background_image = "icons/…"

# Dials (Stream Deck + only) are numbered left to right from 0. Each of
# turn_left / turn_right runs once per detent; press runs when you click the dial.
# [[dial]]
# index = 0
# label = "Workspace"
# glyph = "\\u{e265}"
# # icon = "icons/…"   (or a Nerd Font glyph, as with keys)
# # background_image = "icons/…"   # 200×100, over the strip image for this panel
# [dial.turn_left]
# type = "hyprland"
# dispatch = "workspace e-1"
# [dial.turn_right]
# type = "hyprland"
# dispatch = "workspace e+1"
# [dial.press]
# type = "app"
# command = "walker"
#
# A volume dial: turn to change the output volume, press to mute. Its panel on the
# strip shows the current level and a groove bar, kept in sync with the real volume.
# [[dial]]
# index = 1
# label = "Volume"
# glyph = "f057e"            # a speaker; a mic ("f036c") for an input dial
# [dial.turn_left]
# type = "volume"
# change = -5
# [dial.turn_right]
# type = "volume"
# change = 5
# [dial.press]
# type = "volume"
# mute = true                # toggle mute instead of changing the level
#
# A brightness dial: turn to change the panel brightness. Its panel on the strip
# shows the current value, and the brightness is remembered across restarts.
# [[dial]]
# index = 3
# label = "Brightness"
# glyph = "f00de"            # a sun
# [dial.turn_left]
# type = "brightness"
# change = -5
# [dial.turn_right]
# type = "brightness"
# change = 5
