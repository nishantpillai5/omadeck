# A multi action: its steps run in order, top to bottom; a delay step waits (in
# milliseconds) before the next. Steps don't wait for each other otherwise, so give an
# app time to open before moving its window. Pressing the key again while it runs does
# nothing. (Key 5 is taken above: give it a free index.)
# [[key]]
# index = 5
# label = "Meeting"
# glyph = "f0f4a"
#
# [key.action]
# type = "multi"
#
# [[key.action.steps]]
# type = "volume"
# device = "input"
# mute = true
#
# [[key.action.steps]]
# type = "app"
# command = "zoom.desktop"
#
# [[key.action.steps]]
# type = "delay"
# ms = 2000
#
# [[key.action.steps]]
# type = "hyprland"
# dispatch = "movetoworkspace 5"
#
# [[key.action.steps]]
# type = "page"
# page = "Meeting"

# Live keys: a [key.live] table makes the key show a value the daemon keeps up to
# date: the time ("clock", strftime `format`, default "%H:%M"), "cpu", "memory",
# "battery", the active Hyprland "workspace", or a "command"'s first output line,
# re-run every `interval` seconds (default 5). The key's action still runs on press;
# its label becomes a small caption above the value.
# [[key]]
# index = 7
# label = "CPU"
# action = { type = "app", command = "omarchy launch-or-focus-tui btop" }
# [key.live]
# source = "cpu"
#
# [[key]]
# index = 8
# [key.live]
# source = "clock"
# format = "%H:%M%n%a %d"      # the time, and the day under it
#
# [[key]]
# index = 9
# [key.live]
# source = "command"
# command = "curl -s 'wttr.in/?format=%t'"
# interval = 900

# The touch strip's background image (Stream Deck +): one image across all the
# panels, under the dial panels. Any size - it fills the strip and is
# centre-cropped. Relative paths are against this file's folder.
# [strip]
# background_image = "icons/…"

# Dials (Stream Deck + only) are numbered left to right from 0. Each of
# turn_left / turn_right runs once per detent; press runs when you click the dial.
# [[dial]]
# index = 0
# label = "Workspace"
# glyph = "\\u{e265}"
# # icon = "icons/…"   (or a Nerd Font glyph, as with keys)
# # background_image = "icons/…"   # 200×100, over the strip image for this panel
# [dial.turn_left]
# type = "hyprland"
# dispatch = "workspace e-1"
# [dial.turn_right]
# type = "hyprland"
# dispatch = "workspace e+1"
# [dial.press]
# type = "app"
# command = "walker"
#
# A volume dial: turn to change the output volume, press to mute. Its panel on the
# strip shows the current level and a groove bar, kept in sync with the real volume.
# [[dial]]
# index = 1
# label = "Volume"
# glyph = "f057e"            # a speaker; a mic ("f036c") for an input dial
# [dial.turn_left]
# type = "volume"
# change = -5
# [dial.turn_right]
# type = "volume"
# change = 5
# [dial.press]
# type = "volume"
# mute = true                # toggle mute instead of changing the level
#
# A brightness dial: turn to change the panel brightness. Its panel on the strip
# shows the current value, and the brightness is remembered across restarts.
# [[dial]]
# index = 3
# label = "Brightness"
# glyph = "f00de"            # a sun
# [dial.turn_left]
# type = "brightness"
# change = -5
# [dial.turn_right]
# type = "brightness"
# change = 5
#
# A live dial: its panel shows a value instead of a level (here the battery, with a
# bar; text sources like the clock show no bar).
# [[dial]]
# index = 2
# label = "Battery"
# [dial.live]
# source = "battery"
#
# An app volume dial (in place of the volume dial above): one app's volume, all its
# streams together, capped at 100%. The panel shows the app's icon, name and level,
# dimmed with a dash while the app plays nothing.
# [[dial]]
# index = 1
# label = "Spotify"            # optional; defaults to the app's name
# [dial.turn_left]
# type = "app_volume"
# app = "spotify"              # a process name, app name, Flatpak id or desktop id
# change = -5
# [dial.turn_right]
# type = "app_volume"
# app = "spotify"
# change = 5
# [dial.press]
# type = "app_volume"
# app = "spotify"
# mute = true
#
# A focused-app dial (in place of the battery dial above): whichever app has the
# focused window, or the last focused one that played audio.
# [[dial]]
# index = 2
# [dial.turn_left]
# type = "app_volume"
# focused = true
# change = -5
# [dial.turn_right]
# type = "app_volume"
# focused = true
# change = 5
# [dial.press]
# type = "app_volume"
# focused = true
# mute = true
#
# A media dial (in place of the battery dial above): turn to scrub 5 s per detent,
# press to play or pause. The panel shows the track, artist, cover (local files only)
# and a bar that moves while it plays. Seeking and the panel need `playerctl`.
# [[dial]]
# index = 2
# label = "Media"
# [dial.turn_left]
# type = "media"
# seek = -5                  # seconds per detent
# [dial.turn_right]
# type = "media"
# seek = 5
# [dial.press]
# type = "media"             # play/pause
#
# A media dial that turns the player's own volume (Elgato's Spotify dial): the panel
# still shows the track, as a media action wins the panel.
# [[dial]]
# index = 2
# label = "Spotify"
# [dial.turn_left]
# type = "app_volume"
# app = "spotify"
# change = -5
# [dial.turn_right]
# type = "app_volume"
# app = "spotify"
# change = 5
# [dial.press]
# type = "media"
# player = "spotify"
